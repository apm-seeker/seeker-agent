language: "ko-KR"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  review_details: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"
    - "!**/*.class"
    - "!**/*.jar"
    - "!**/bin/**"

  path_instructions:
    - path: "agent-bootstrap/**"
      instructions: |
        Focus on Java agent bootstrap safety. Check that agent initialization failures do not break the target application.

    - path: "agent-instrument/**"
      instructions: |
        Focus on Byte Buddy instrumentation safety, matcher scope, advice overhead, and exception isolation.

    - path: "plugins/**"
      instructions: |
        Check whether instrumentation targets are narrow enough and whether plugin failures are fail-open.

    - path: "agent-sender/**"
      instructions: |
        Check that telemetry sending does not add blocking network I/O to application request threads.

    - path: "agent-config/**"
      instructions: |
        Check default values, config parsing, and documentation consistency for public configuration keys.

    - path: "agent-core/**"
      instructions: |
        Check trace context lifecycle, scope cleanup, propagation behavior, and compatibility-sensitive model changes.

    - path: "agent-metric/**"
      instructions: |
        Check collector overhead, bounded scheduling behavior, and metric schema compatibility.

    - path: "**/*.md"
      instructions: |
        Review clarity, accuracy, broken links, and consistency between English and Korean documentation.

chat:
  auto_reply: true
